[package]
name = "zemeroth"
version = "0.7.0-snapshot"
authors = ["Andrey Lesnikov <ozkriff@gmail.com>"]
edition = "2018"
license = "MIT/Apache-2.0"
description = "A 2D turn-based hexagonal tactical game."

[package.metadata.android]
assets = "assets/"

[dependencies]
ron = "0.6"
log = "0.4"
env_logger = "0.9"
derive_more = { version = "0.99", features = ["from"] }
serde = { version = "1.0", features = ["derive"] }
num = { version = "0.4", default-features = false }
ui = { path = "zgui", package = "zgui" }
zscene = { path = "zscene" }
zcomponents = { path = "zcomponents" }
rand = { version = "0.8", default-features = false, features = ["alloc"] }
quad-rand = { version = "0.2", features = ["rand"] }
mq = { package = "macroquad", version = "0.4" }
# The wasmcart backend: pad state for the gamepad controls, debug values.
wasmcart-macroquad = { git = "https://github.com/wasmcart/wasmcart-macroquad", rev = "eb7b0f5", features = ["debug"] }
heck = "0.3"
once_cell = "1.6"

[dev-dependencies]
pretty_assertions = "0.7"

# quad-rand 0.2.3 turns on rand's default features, which ask getrandom for an
# OS source; wasm32-unknown-unknown has none. The game draws its numbers from
# quad-rand's generator, so getrandom gets a stub that is never called.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
