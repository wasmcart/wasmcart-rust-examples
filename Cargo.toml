[workspace]
resolver = "2"
members = ["games/*"]

[patch.crates-io]
# macroquad games: miniquad with the wasmcart backend (wasmcart-macroquad).
miniquad = { git = "https://github.com/wasmcart/wasmcart-macroquad", rev = "eb7b0f5" }
# Bevy games: three Bevy crates with their browser-only (wasm-bindgen) code
# kept off on wasm32-wasip1 (see wasmcart-bevy's README).
bevy_asset = { git = "https://github.com/wasmcart/wasmcart-bevy", rev = "52cc476" }
bevy_render = { git = "https://github.com/wasmcart/wasmcart-bevy", rev = "52cc476" }
bevy_log = { git = "https://github.com/wasmcart/wasmcart-bevy", rev = "52cc476" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
